<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
#root { position:absolute; inset:0; background:#0f172a; overflow:hidden; }
.wrap { position:absolute; inset:0; opacity:0; }
.app-frame { position:absolute; inset:0; display:flex; }
.sidebar { width:220px; background:#1e293b; border-right:1px solid #334155; display:flex; flex-direction:column; padding:14px 0; }
.sidebar-logo { padding:0 16px 14px; font-family:Inter,sans-serif; font-weight:800; font-size:16px; color:#f8fafc; border-bottom:1px solid #334155; margin-bottom:6px; padding-bottom:14px; }
.sidebar-logo .a { color:#FBBF24; }
.nav-item { padding:8px 16px; font-family:Inter,sans-serif; font-size:13px; color:#94a3b8; }
.editor-main { flex:1; display:flex; flex-direction:column; }
.topbar { height:52px; display:flex; align-items:center; padding:0 16px; gap:12px; border-bottom:1px solid #334155; }
.page-label { font-family:Inter,sans-serif; font-size:14px; font-weight:600; color:#f8fafc; }
.paper-area { flex:1; display:flex; align-items:center; justify-content:center; padding:20px; }
.paper { width:700px; height:800px; background:#fff; border-radius:4px; box-shadow:0 20px 60px rgba(0,0,0,0.5); position:relative; overflow:hidden; }
.rline { position:absolute; left:40px; right:40px; height:1px; background:#e2e8f0; }
.chat-btn { position:absolute; bottom:20px; right:20px; width:48px; height:48px; border-radius:50%; background:#1e293b; border:2px solid #334155; color:#60a5fa; font-size:20px; cursor:pointer; z-index:100; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 16px rgba(0,0,0,0.4); }
.chat-drawer { position:absolute; top:52px; right:0; bottom:0; width:400px; background:#1e293b; border-left:1px solid #334155; display:flex; flex-direction:column; transform:translateX(100%); opacity:0; z-index:90; }
.drawer-header { padding:12px 16px; border-bottom:1px solid #334155; display:flex; align-items:center; gap:10px; }
.drawer-avatar { width:30px; height:30px; border-radius:50%; background:#2563eb; display:flex; align-items:center; justify-content:center; color:#fff; font-size:14px; }
.drawer-name { font-family:Inter,sans-serif; font-weight:700; font-size:15px; color:#f8fafc; }
.drawer-sub { font-family:Inter,sans-serif; font-size:11px; color:#94a3b8; }
.drawer-messages { flex:1; padding:12px 16px; overflow-y:auto; display:flex; flex-direction:column; gap:10px; }
.msg { padding:10px 14px; border-radius:12px; font-family:Inter,sans-serif; font-size:13px; max-width:90%; line-height:1.4; }
.msg.user { align-self:flex-end; background:#2563eb; color:#fff; }
.msg.ai { align-self:flex-start; background:#0f172a; color:#e2e8f0; border:1px solid #334155; }
.typing-dots { display:inline-flex; gap:4px; align-items:center; padding:8px 0; }
.typing-dots span { width:5px; height:5px; border-radius:50%; background:#64748b; animation:blink 1.2s infinite; }
.typing-dots span:nth-child(2) { animation-delay:0.2s; }
.typing-dots span:nth-child(3) { animation-delay:0.4s; }
@keyframes blink { 0%,100%{opacity:0.2;}50%{opacity:1;} }
.drawer-input { padding:10px 16px; border-top:1px solid #334155; }
.drawer-input input { width:100%; background:#0f172a; border:1px solid #334155; border-radius:10px; padding:8px 12px; font-family:Inter,sans-serif; font-size:13px; color:#f8fafc; outline:none; box-sizing:border-box; }
</style>
</head>
<body style="margin:0;background:#0f172a;">
<div id="root" data-composition-id="s4" data-width="1920" data-height="1080">
  <div class="wrap" id="s4-wrap">
    <div class="app-frame">
      <div class="sidebar">
        <div class="sidebar-logo">Nohome<span class="a">Work</span></div>
        <div class="nav-item" data-layout-ignore>Documents</div>
        <div class="nav-item" data-layout-ignore>Favorites</div>
        <div class="nav-item" data-layout-ignore>Folders</div>
        <div class="nav-item" data-layout-ignore>Bookmarks</div>
        <div class="nav-item" data-layout-ignore>Trash</div>
      </div>
      <div class="editor-main" id="s4-editor">
        <div class="topbar">
          <button class="back-btn" data-layout-ignore>← Back</button>
          <div class="page-label">My Notebook — Page 1</div>
        </div>
        <div class="paper-area">
          <div class="paper" id="s4-paper">
            <div class="rline" style="top:60px"></div>
            <div class="rline" style="top:100px"></div>
            <div class="rline" style="top:140px"></div>
            <div class="rline" style="top:180px"></div>
            <div class="rline" style="top:220px"></div>
            <div class="rline" style="top:260px"></div>
            <div class="rline" style="top:300px"></div>
            <div class="rline" style="top:340px"></div>
            <div class="rline" style="top:380px"></div>
            <div class="rline" style="top:420px"></div>
            <div class="rline" style="top:460px"></div>
            <div class="rline" style="top:500px"></div>
            <svg style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;" viewBox="0 0 700 800" preserveAspectRatio="xMidYMid meet">
              <path d="M 40 80 Q 150 65 300 75 T 660 70" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
              <path d="M 40 155 Q 160 148 320 152 T 660 158" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
              <path d="M 40 330 Q 180 322 340 328 T 660 335" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
              <path d="M 20 310 Q 180 302 340 308 T 660 315" fill="none" stroke="#FBBF24" stroke-width="20" stroke-linecap="round" opacity="0.7"/>
            </svg>
          </div>
        </div>
        <div class="chat-btn" id="s4-chat-btn">&#9733;</div>
      </div>
      <div class="chat-drawer" id="s4-drawer">
        <div class="drawer-header">
          <div class="drawer-avatar">&#9733;</div>
          <div><div class="drawer-name">Homie</div><div class="drawer-sub" data-layout-ignore>AI Assistant</div></div>
        </div>
        <div class="drawer-messages">
          <div class="msg user" id="s4-msg1" style="opacity:0;transform:translateX(15px)">Summarize this page</div>
          <div id="s4-typing" style="opacity:0;padding:4px 0">
            <div class="typing-dots"><span></span><span></span><span></span></div>
          </div>
          <div class="msg ai" id="s4-msg2" style="opacity:0;transform:translateX(-15px)">This page covers Newton's laws of motion and key derivations for classical mechanics...</div>
        </div>
        <div class="drawer-input">
          <input placeholder="Ask Homie anything..." readonly />
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
// Start from editor view (fade in from scene 3)
tl.fromTo("#s4-wrap", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
// Click chat button
tl.to("#s4-chat-btn", { scale: 1.05, duration: 0.12, ease: "power2.inOut" }, 0.5);
tl.to("#s4-chat-btn", { scale: 1, duration: 0.1, ease: "power2.inOut" }, 0.62);
// Drawer slides in
tl.fromTo("#s4-drawer", { opacity: 0, x: 400 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.inOut" }, 0.8);
// User message
tl.fromTo("#s4-msg1", { opacity: 0, x: 15 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, 1.1);
// Typing dots
tl.to("#s4-typing", { opacity: 1, duration: 0.15 }, 1.5);
// AI response
tl.fromTo("#s4-msg2", { opacity: 0, x: -15 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out" }, 1.9);
// Fade out drawer
tl.to("#s4-drawer", { opacity: 0, duration: 0.4, ease: "power2.in" }, 4.5);
window.__timelines["s4"] = tl;
</script>
</body>
</html>
