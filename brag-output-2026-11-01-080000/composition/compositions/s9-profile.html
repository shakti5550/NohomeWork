<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
#root { position:absolute; inset:0; background:#0f172a; overflow:hidden; }
.wrap { position:absolute; inset:0; opacity:0; }
/* Profile dropdown view */
.profile-view { position:absolute; inset:0; }
.sidebar { position:absolute; left:0; top:0; bottom:0; width:220px; background:#1e293b; border-right:1px solid #334155; display:flex; flex-direction:column; padding:14px 0; }
.sidebar-logo { padding:0 16px 14px; font-family:Inter,sans-serif; font-weight:800; font-size:16px; color:#f8fafc; border-bottom:1px solid #334155; margin-bottom:6px; padding-bottom:14px; }
.sidebar-logo .a { color:#FBBF24; }
.nav-item { padding:8px 16px; font-family:Inter,sans-serif; font-size:13px; color:#94a3b8; }
.topbar { position:absolute; top:0; left:220px; right:0; height:52px; display:flex; align-items:center; padding:0 24px; border-bottom:1px solid #334155; }
.topbar-title { font-family:Outfit,sans-serif; font-weight:700; font-size:22px; color:#f8fafc; }
.profile-avatar { position:absolute; top:10px; right:16px; width:38px; height:38px; border-radius:50%; background:#334155; display:flex; align-items:center; justify-content:center; color:#94a3b8; font-size:18px; cursor:pointer; }
.dropdown { position:absolute; top:56px; right:16px; width:240px; background:#1e293b; border:1px solid #334155; border-radius:12px; box-shadow:0 16px 40px rgba(0,0,0,0.5); opacity:0; transform:scale(0.9); overflow:hidden; }
.dd-header { padding:14px 16px; border-bottom:1px solid #334155; }
.dd-name { font-family:Inter,sans-serif; font-weight:600; font-size:15px; color:#f8fafc; }
.dd-email { font-family:Inter,sans-serif; font-size:12px; color:#94a3b8; }
.dd-item { padding:10px 16px; font-family:Inter,sans-serif; font-size:14px; color:#94a3b8; display:flex; align-items:center; gap:8px; cursor:pointer; }
.dd-item:hover { background:#334155; color:#f8fafc; }
.dd-item.danger { color:#f87171; }
.dd-item.danger:hover { background:rgba(239,68,68,0.1); }
/* Signed out */
.signed-out { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; }
.logo-icon { width:80px; height:80px; margin-bottom:16px; }
.logo-icon rect { fill:#0f172a; stroke:#334155; stroke-width:2; rx:16; }
.so-text { font-family:Inter,sans-serif; font-size:16px; color:#94a3b8; }
</style>
</head>
<body style="margin:0;background:#0f172a;">
<div id="root" data-composition-id="s9" data-width="1920" data-height="1080">
  <div class="wrap" id="s9-wrap">
    <div class="profile-view" id="s9-profile">
      <div class="sidebar">
        <div class="sidebar-logo">Nohome<span class="a">Work</span></div>
        <div class="nav-item" data-layout-ignore data-layout-ignore data-layout-ignore>Documents</div>
        <div class="nav-item" data-layout-ignore>Favorites</div>
        <div class="nav-item" data-layout-ignore>Folders</div>
        <div class="nav-item" data-layout-ignore>Bookmarks</div>
        <div class="nav-item" data-layout-ignore>Trash</div>
      </div>
      <div class="topbar"><div class="topbar-title" data-layout-ignore data-layout-ignore>Documents</div></div>
      <div class="profile-avatar" id="s9-avatar">Q</div>
      <div class="dropdown" id="s9-dd">
        <div class="dd-header"><div class="dd-name">Shakti Sidheswar</div><div class="dd-email" data-layout-ignore data-layout-ignore>shakti@example.com</div></div>
        <div class="dd-item">&#9881; Settings</div>
        <div class="dd-item">&#9733; Favorites</div>
        <div class="dd-item danger" id="s9-signout">&#128465; Sign Out</div>
      </div>
    </div>
    <div class="signed-out" id="s9-signedout">
      <svg class="logo-icon" viewBox="0 0 80 80">
        <rect width="80" height="80" rx="16" />
        <line x1="16" y1="22" x2="48" y2="22" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9"/>
        <line x1="16" y1="34" x2="44" y2="34" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9"/>
        <path d="M 18 54 L 38 22 L 62 16 L 48 52" stroke="#FBBF24" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <div class="so-text" id="s9-so-text" style="opacity:0">Signed out</div>
    </div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo("#s9-wrap", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0);
// Click profile
tl.to("#s9-avatar", { scale: 1.1, duration: 0.1, ease: "power2.inOut" }, 0.2);
tl.to("#s9-avatar", { scale: 1, duration: 0.1, ease: "power2.inOut" }, 0.3);
// Dropdown opens
tl.fromTo("#s9-dd", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 0.35);
// Hover sign out
tl.to("#s9-signout", { background: "rgba(239,68,68,0.1)", duration: 0.12 }, 0.7);
tl.to("#s9-signout", { background: "transparent", duration: 0.1 }, 0.82);
// Click
tl.to("#s9-dd", { opacity: 0, scale: 0.95, duration: 0.2 }, 0.9);
tl.to("#s9-profile", { opacity: 0, duration: 0.3 }, 0.95);
// Show signed out
document.getElementById('s9-signedout').style.display = 'flex';
tl.fromTo("#s9-signedout", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 1.2);
tl.fromTo("#s9-so-text", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 1.35);
window.__timelines["s9"] = tl;
</script>
</body>
</html>
