<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
#root { position:absolute; inset:0; background:#0f172a; overflow:hidden; }
.wrap { position:absolute; inset:0; opacity:0; }
.app-frame { position:absolute; inset:0; display:flex; }
.sidebar { width:220px; background:#1e293b; border-right:1px solid #334155; display:flex; flex-direction:column; padding:14px 0; }
.sidebar-logo { padding:0 16px 14px; font-family:Inter,sans-serif; font-weight:800; font-size:16px; color:#f8fafc; border-bottom:1px solid #334155; margin-bottom:6px; padding-bottom:14px; }
.sidebar-logo .a { color:#FBBF24; }
.nav-item { padding:8px 16px; font-family:Inter,sans-serif; font-size:13px; color:#94a3b8; }
.nav-item.active { color:#f87171; background:rgba(239,68,68,0.1); border-left:3px solid #ef4444; }
.main { flex:1; display:flex; flex-direction:column; }
.topbar { height:52px; display:flex; align-items:center; padding:0 24px; border-bottom:1px solid #334155; gap:12px; }
.topbar-title { font-family:Outfit,sans-serif; font-weight:700; font-size:22px; color:#f8fafc; }
.empty-btn { font-family:Inter,sans-serif; font-size:13px; padding:6px 14px; border-radius:8px; background:transparent; color:#f87171; border:1px solid #f87171; cursor:pointer; }
.content { flex:1; padding:18px 24px; display:flex; gap:16px; overflow:hidden; }
.panel { flex:1; background:#1e293b; border:1px solid #334155; border-radius:12px; padding:14px; overflow-y:auto; display:flex; flex-direction:column; }
.panel-title { font-family:Inter,sans-serif; font-size:14px; font-weight:600; color:#94a3b8; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
.item { display:flex; align-items:center; gap:10px; padding:12px; background:#0f172a; border:1px solid #334155; border-radius:10px; margin-bottom:8px; opacity:0; transform:translateY(6px); }
.icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.icon.nb { background:rgba(37,99,235,0.2); }
.icon.fd { background:rgba(251,191,36,0.2); }
.info { flex:1; min-width:0; }
.name { font-family:Inter,sans-serif; font-weight:600; font-size:15px; color:#f8fafc; }
.date { font-family:Inter,sans-serif; font-size:12px; color:#cbd5e1; }
.actions { display:flex; gap:6px; margin-top:6px; }
.btn-rst { font-family:Inter,sans-serif; font-size:11px; padding:4px 10px; border-radius:6px; background:transparent; color:#60a5fa; border:1px solid #60a5fa; cursor:pointer; }
.btn-del { font-family:Inter,sans-serif; font-size:11px; padding:4px 10px; border-radius:6px; background:transparent; color:#f87171; border:1px solid #f87171; cursor:pointer; }
</style>
</head>
<body style="margin:0;background:#0f172a;">
<div id="root" data-composition-id="s8" data-width="1920" data-height="1080">
  <div class="wrap" id="s8-wrap">
    <div class="app-frame">
      <div class="sidebar">
        <div class="sidebar-logo">Nohome<span class="a">Work</span></div>
        <div class="nav-item" data-layout-ignore data-layout-ignore data-layout-ignore>Documents</div>
        <div class="nav-item" data-layout-ignore>Favorites</div>
        <div class="nav-item" data-layout-ignore>Folders</div>
        <div class="nav-item" data-layout-ignore>Bookmarks</div>
        <div class="nav-item active">Trash</div>
      </div>
      <div class="main">
        <div class="topbar">
          <div class="topbar-title">Trash</div>
          <button class="empty-btn">Empty Trash</button>
        </div>
        <div class="content">
          <div class="panel">
            <div class="panel-title" data-layout-ignore data-layout-ignore>&#128465; Notebooks</div>
            <div class="item" id="s8-nb1">
              <div class="icon nb">&#128203;</div>
              <div class="info">
                <div class="name">Old Drafts</div>
                <div class="date" data-layout-ignore data-layout-ignore>Deleted 3 days ago</div>
                <div class="actions" data-layout-ignore data-layout-ignore><button class="btn-rst">Restore</button><button class="btn-del">Delete</button></div>
              </div>
            </div>
            <div class="item" id="s8-nb2">
              <div class="icon nb">&#128203;</div>
              <div class="info">
                <div class="name">Test Notebook</div>
                <div class="date">Deleted last week</div>
                <div class="actions"><button class="btn-rst">Restore</button><button class="btn-del">Delete</button></div>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-title">&#128193; Folders</div>
            <div class="item" id="s8-fd1">
              <div class="icon fd">&#128193;</div>
              <div class="info">
                <div class="name">Unused Project</div>
                <div class="date">Deleted 1 month ago</div>
                <div class="actions"><button class="btn-rst">Restore</button><button class="btn-del">Delete</button></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo("#s8-wrap", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
tl.fromTo("#s8-nb1", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.1);
tl.fromTo("#s8-nb2", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.3);
tl.fromTo("#s8-fd1", { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, 0.5);
// Highlight notebooks
tl.to("#s8-nb1", { boxShadow: "0 0 0 2px #60a5fa", duration: 0.2, ease: "power2.inOut" }, 0.9);
tl.to("#s8-nb1", { boxShadow: "none", duration: 0.2, ease: "power2.inOut" }, 1.1);
tl.to("#s8-fd1", { boxShadow: "0 0 0 2px #60a5fa", duration: 0.2, ease: "power2.inOut" }, 1.4);
tl.to("#s8-fd1", { boxShadow: "none", duration: 0.2, ease: "power2.inOut" }, 1.6);
// Hold with subtle animation
tl.to("#s8-nb1", { y: 2, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 1.8);
window.__timelines["s8"] = tl;
</script>
</body>
</html>
