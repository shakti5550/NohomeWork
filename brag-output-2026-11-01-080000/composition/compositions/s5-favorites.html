<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
#root { position:absolute; inset:0; background:#0f172a; overflow:hidden; }
.wrap { position:absolute; inset:0; opacity:0; }
.app-frame { position:absolute; inset:0; display:flex; }
.sidebar { width:220px; background:#1e293b; border-right:1px solid #334155; display:flex; flex-direction:column; padding:14px 0; }
.sidebar-logo { padding:0 16px 14px; font-family:Inter,sans-serif; font-weight:800; font-size:16px; color:#f8fafc; border-bottom:1px solid #334155; margin-bottom:6px; padding-bottom:14px; }
.sidebar-logo .a { color:#FBBF24; }
.nav-item { padding:8px 16px; font-family:Inter,sans-serif; font-size:13px; color:#94a3b8; }
.nav-item.active { color:#fbbf24; background:rgba(251,191,36,0.1); border-left:3px solid #fbbf24; }
.main { flex:1; display:flex; flex-direction:column; }
.topbar { height:52px; display:flex; align-items:center; padding:0 24px; border-bottom:1px solid #334155; }
.topbar-title { font-family:Outfit,sans-serif; font-weight:700; font-size:22px; color:#f8fafc; }
.grid { flex:1; padding:20px 24px; display:flex; flex-wrap:wrap; gap:16px; align-content:flex-start; overflow-y:auto; }
.card { width:220px; height:260px; border-radius:16px; display:flex; flex-direction:column; justify-content:space-between; padding:18px; box-shadow:0 16px 40px rgba(0,0,0,0.4); cursor:pointer; opacity:0; transform:translateY(25px); }
.card .kicker { font-family:Inter,sans-serif; font-weight:600; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.8); }
.card .title { font-family:Outfit,sans-serif; font-weight:700; font-size:20px; color:#fff; line-height:1.2; }
</style>
</head>
<body style="margin:0;background:#0f172a;">
<div id="root" data-composition-id="s5" data-width="1920" data-height="1080">
  <div class="wrap" id="s5-wrap">
    <div class="app-frame">
      <div class="sidebar">
        <div class="sidebar-logo">Nohome<span class="a">Work</span></div>
        <div class="nav-item" data-layout-ignore data-layout-ignore>Documents</div>
        <div class="nav-item active">Favorites</div>
        <div class="nav-item" data-layout-ignore>Folders</div>
        <div class="nav-item" data-layout-ignore>Bookmarks</div>
        <div class="nav-item" data-layout-ignore>Trash</div>
      </div>
      <div class="main">
        <div class="topbar"><div class="topbar-title">Favorites</div></div>
        <div class="grid">
          <div class="card" id="s5-c1" style="background:#1976d2;"><div><div class="kicker" data-layout-ignore>Notebook</div><div class="title">Physics Notes</div></div></div>
          <div class="card" id="s5-c2" style="background:#2e7d32;"><div><div class="kicker" data-layout-ignore>Notebook</div><div class="title">Lecture Drafts</div></div></div>
          <div class="card" id="s5-c3" style="background:#7c3aed;"><div><div class="kicker" data-layout-ignore>Notebook</div><div class="title">Research Papers</div></div></div>
          <div class="card" id="s5-c4" style="background:#dc2626;"><div><div class="kicker" data-layout-ignore>Notebook</div><div class="title">Math Proofs</div></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo("#s5-wrap", { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, 0);
tl.fromTo("#s5-c1", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 0.2);
tl.fromTo("#s5-c2", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 0.45);
tl.fromTo("#s5-c3", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 0.7);
tl.fromTo("#s5-c4", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.4, ease: "power4.out" }, 0.95);
// Highlight first card
tl.to("#s5-c1", { boxShadow: "0 0 0 3px #FBBF24, 0 16px 40px rgba(0,0,0,0.5)", duration: 0.25, ease: "power2.inOut" }, 1.4);
tl.to("#s5-c1", { boxShadow: "0 16px 40px rgba(0,0,0,0.4)", duration: 0.25, ease: "power2.inOut" }, 1.7);
// Subtle hover
tl.to("#s5-c1", { y: -3, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 2);
window.__timelines["s5"] = tl;
</script>
</body>
</html>
