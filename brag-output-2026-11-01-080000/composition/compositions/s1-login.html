<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
#root { position:absolute; inset:0; background:#0f172a; overflow:hidden; }
.wrap { position:absolute; inset:0; opacity:0; }
.laptop { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:1400px; }
.laptop-frame { position:relative; background:#1a1a2e; border-radius:16px; padding:12px 12px 0; box-shadow:0 40px 100px rgba(0,0,0,0.6); }
.laptop-bezel { width:100%; background:#111; border-radius:8px 8px 0 0; overflow:hidden; }
.screen { width:100%; height:700px; background:#0f172a; position:relative; display:flex; align-items:center; justify-content:center; }
.card { width:680px; background:#1e293b; border-radius:24px; border:1px solid #334155; padding:48px 44px; box-shadow:0 40px 80px rgba(0,0,0,0.5); opacity:0; transform:translateY(25px); }
.logo-svg { width:72px; height:72px; margin:0 auto 16px; }
.logo-svg rect { fill:#0f172a; stroke:#334155; stroke-width:2; rx:14; }
.brand { text-align:center; font-family:Outfit,sans-serif; font-weight:800; font-size:38px; color:#f8fafc; letter-spacing:-1px; margin-bottom:4px; }
.brand .a { color:#FBBF24; }
.sub { text-align:center; font-family:Inter,sans-serif; font-size:15px; color:#94a3b8; margin-bottom:28px; }
.field { margin-bottom:14px; }
.field label { display:block; font-family:Inter,sans-serif; font-size:13px; color:#94a3b8; margin-bottom:5px; }
.field input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid #334155; background:#0f172a; color:#f8fafc; font-family:Inter,sans-serif; font-size:15px; outline:none; box-sizing:border-box; }
.btn-signin { width:100%; padding:12px; border-radius:10px; border:none; background:#2563eb; color:#fff; font-family:Inter,sans-serif; font-size:15px; font-weight:600; cursor:pointer; margin-top:6px; }
.divider { display:flex; align-items:center; gap:10px; margin:16px 0; color:#64748b; font-family:Inter,sans-serif; font-size:12px; }
.divider::before,.divider::after { content:''; flex:1; height:1px; background:#334155; }
.toggle { text-align:center; font-family:Inter,sans-serif; font-size:13px; color:#94a3b8; margin-top:16px; }
.toggle span { color:#60a5fa; cursor:pointer; }
.cursor { position:absolute; width:16px; height:16px; pointer-events:none; z-index:100; filter:drop-shadow(0 2px 4px rgba(0,0,0,0.5)); opacity:0; }
</style>
</head>
<body style="margin:0;background:#0f172a;">
<div id="root" data-composition-id="s1" data-width="1920" data-height="1080">
  <div class="wrap" id="s1-wrap">
    <div class="laptop">
      <div class="laptop-frame">
        <div class="laptop-bezel">
          <div class="screen">
            <div class="card" id="s1-card">
              <svg class="logo-svg" viewBox="0 0 80 80">
                <rect width="80" height="80" rx="14" />
                <line x1="16" y1="24" x2="48" y2="24" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9"/>
                <line x1="16" y1="36" x2="44" y2="36" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9"/>
                <line x1="16" y1="48" x2="34" y2="48" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-opacity="0.9"/>
                <path d="M 20 66 L 38 30 L 62 24 L 48 62" stroke="#FBBF24" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
              </svg>
              <div class="brand">Nohome<span class="a">Work</span></div>
              <div class="sub">Welcome back</div>
              <div class="field"><label data-layout-ignore>Email</label><input placeholder="you@example.com" /></div>
              <div class="field"><label data-layout-ignore>Password</label><input type="password" placeholder="••••••••" /></div>
              <button class="btn-signin" data-layout-ignore id="s1-btn">Sign In</button>
              <div class="divider" data-layout-ignore>or</div>
              <div class="toggle" data-layout-ignore>Don't have an account? <span>Sign up</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo("#s1-wrap", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 0.1);
tl.fromTo("#s1-card", { opacity: 0, y: 25 }, { opacity: 1, y: 0, duration: 0.7, ease: "power4.out" }, 0.3);
// Cursor movement to sign in
tl.to("#s1-btn", { scale: 0.97, duration: 0.12, ease: "power2.inOut" }, 2.2);
tl.to("#s1-btn", { scale: 1, duration: 0.15, ease: "power2.out" }, 2.32);
// Fade out
tl.to("#s1-card", { opacity: 0, y: -20, duration: 0.45, ease: "power2.in" }, 2.6);
window.__timelines["s1"] = tl;
</script>
</body>
</html>
