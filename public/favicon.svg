<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB" />
      <stop offset="1" stop-color="#1D4ED8" />
    </linearGradient>
  </defs>

  <!-- Full-bleed vibrant blue background - no inner box, no borders -->
  <rect width="128" height="128" fill="url(#bg_grad)" />

  <!-- White document lines -->
  <line x1="22" y1="36" x2="76" y2="36" stroke="white" stroke-width="7" stroke-linecap="round" stroke-opacity="0.95" />
  <line x1="22" y1="56" x2="70" y2="56" stroke="white" stroke-width="7" stroke-linecap="round" stroke-opacity="0.95" />
  <line x1="22" y1="76" x2="52" y2="76" stroke="white" stroke-width="7" stroke-linecap="round" stroke-opacity="0.95" />

  <!-- Bold Yellow Stylus / Folding 'N' Stroke filling the icon -->
  <path
    d="M36 104 L68 46 L102 28 L82 96"
    stroke="#FBBF24"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
